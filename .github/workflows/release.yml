name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack module zip
        run: |
          mkdir -p agentic-dj
          cp module.json LICENSE README.md agentic-dj/
          cp -r src styles templates lang agentic-dj/
          zip -r agentic-dj.zip agentic-dj
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            agentic-dj.zip
          generate_release_notes: true
